<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Cortex — Sign In</title>
    <link rel="stylesheet" href="auth.css" />
</head>

<body>
    <!-- animated gradient background -->
    <div class="bg-gradient"></div>

    <div class="auth-wrapper">
        <!-- Glassmorphism card -->
        <div class="auth-card">
            <!-- Logo / brand -->
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <path fill="currentColor"
                            d="M12,2C6.47,2 2,6.47 2,12C2,17.53 6.47,22 12,22C17.53,22 22,17.53 22,12C22,6.47 17.53,2 12,2M15.85,8.14C16.23,8.14 16.54,8.45 16.54,8.83C16.54,9.21 16.23,9.53 15.85,9.53C15.47,9.53 15.15,9.21 15.15,8.83C15.15,8.45 15.47,8.14 15.85,8.14M8.15,8.14C8.53,8.14 8.85,8.45 8.85,8.83C8.85,9.21 8.53,9.53 8.15,9.53C7.77,9.53 7.46,9.21 7.46,8.83C7.46,8.45 7.77,8.14 8.15,8.14M12,17.5C9.67,17.5 7.69,16.04 6.89,14H17.11C16.31,16.04 14.33,17.5 12,17.5Z" />
                    </svg>
                </div>
                <h1>Cortex</h1>
                <p class="tagline">Your AI-powered chat/RAG assistant</p>
            </div>

            <!-- Status message bar -->
            <div id="status-bar" class="status-bar hidden"></div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="login-form" class="auth-form active" autocomplete="off">
                <h2>Welcome back</h2>

                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email" required />
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Enter your password" required
                            minlength="6" maxlength="200" />
                        <button type="button" class="password-toggle" id="login-pw-toggle" tabindex="-1"
                            title="Show password">
                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor"
                                    d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" />
                            </svg>
                            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" width="20" height="20"
                                style="display:none;">
                                <path fill="currentColor"
                                    d="M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader hidden"></span>
                </button>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" id="show-register">Create account</a>
                </p>
            </form>

            <!-- ===== REGISTER FORM ===== -->
            <form id="register-form" class="auth-form" autocomplete="off">
                <h2>Create account</h2>

                <div class="input-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" placeholder="Choose a username" required minlength="3" />
                </div>

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Enter your email" required />
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required minlength="6"
                        maxlength="200" />
                </div>

                <div class="input-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <input type="password" id="reg-confirm" placeholder="Confirm your password" required minlength="6"
                        maxlength="200" />
                </div>

                <button type="submit" class="btn-primary" id="register-btn">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loader hidden"></span>
                </button>

                <p class="switch-text">
                    Already have an account?
                    <a href="#" id="show-login">Sign in</a>
                </p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
